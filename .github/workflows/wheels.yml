name: Wheels

# The Python package's release wheel: one abi3 wheel (CPython >= 3.10) for Linux x86_64, built in
# a manylinux_2_28 container so it installs on any glibc >= 2.28 distribution, tested on 3.10
# and 3.13, and attached to the GitHub release of a `v*` tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: manylinux_2_28 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: "2_28"
          args: --release --out dist
          # HDF5 is built from source and needs CMake >= 3.26
          before-script-linux: python3 -m pip install "cmake>=3.26"
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.10
      # no GPU on the runner: tiles are generated on the CPU
      - name: Test on 3.10 and 3.13
        working-directory: bindings/python
        env:
          VK_DRIVER_FILES: /nonexistent.json
          VK_ICD_FILENAMES: /nonexistent.json
        run: |
          for v in 3.10 3.13; do
            python$v -m venv /tmp/venv$v
            /tmp/venv$v/bin/pip install dist/*.whl pytest
            /tmp/venv$v/bin/python -m pytest -q tests
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: bindings/python/dist/*.whl

  release:
    name: Attach to the release
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.whl --clobber --repo "${GITHUB_REPOSITORY}"

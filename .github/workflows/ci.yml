name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a branch / PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m compileall -q scripts showcase bindings/python

  # Clippy and the tests in one job: HDF5 is built from source (hdf5-metno-sys, features static +
  # zlib: CMake and a C compiler, both on the runner image) and its build-script output is shared
  # between the clippy and the build / test steps instead of being compiled twice.
  test:
    name: clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs read master's cache but do not write their own.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Build
        run: cargo build --release --workspace --all-targets

      # `cargo install --path` reuses the workspace's release build
      - name: cargo install
        run: |
          cargo install --locked --path crates/cli --root "$RUNNER_TEMP/terrain"
          "$RUNNER_TEMP/terrain/bin/terrain" --version

      # No Vulkan driver here (the runner has no GPU, and the variables hide any ICD the image
      # might ship): the GPU tests skip themselves and the generator falls back to the CPU.
      - name: Test (CPU)
        env:
          VK_DRIVER_FILES: /nonexistent.json
          VK_ICD_FILENAMES: /nonexistent.json
        run: cargo test --release --workspace

      # Lavapipe (Mesa's software Vulkan) runs the GPU tests that fit its limits: the event
      # sensor against the CPU sensor and the WGSL noise against the CPU noise. The full GPU tile
      # generator needs 256 MiB storage bindings (lavapipe allows 128 MiB): there it falls back to
      # the CPU, so the tile comparisons stay on GPU machines.
      - name: Install lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - name: Test (GPU on lavapipe)
        shell: bash
        run: |
          cargo test --release --workspace -- --nocapture gpu::events:: gpu::tests::noise_matches_the_cpu 2>&1 | tee gpu-tests.log
          # the tests return early without an adapter: make sure they did run
          if grep -q "skipped" gpu-tests.log; then
            echo "::error::GPU tests were skipped: lavapipe gave no usable adapter"
            exit 1
          fi

  # macOS (Apple silicon and Intel) and Windows (MSVC): build, test and `cargo install`. The
  # runners have no GPU for the generator (macOS: Metal has no f64 shaders; Windows: no adapter or
  # WARP without 64-bit shaders), so tiles are generated on the CPU there, as for most users
  # without a discrete GPU; the GPU tests skip themselves when no adapter can run them.
  test-os:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          # The Intel runner's Metal device ("Apple Paravirtual device") renders nothing (depth
          # all non-finite, black images) where the arm64 one matches the CPU renderer: the GPU
          # is hidden there (an AERIALSYNTH_GPU that matches no adapter), as on Linux without a
          # Vulkan driver, so the GPU tests skip and everything runs on the CPU.
          - { name: macOS x86_64, os: macos-15-intel, gpu: none }
          - { name: Windows x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build
        run: cargo build --release --workspace --all-targets
      - name: Test
        env:
          AERIALSYNTH_GPU: ${{ matrix.gpu }}
        run: cargo test --release --workspace --no-fail-fast
      - name: cargo install
        shell: bash
        run: |
          cargo install --locked --path crates/cli --root "$RUNNER_TEMP/terrain"
          "$RUNNER_TEMP/terrain/bin/terrain" --version
          "$RUNNER_TEMP/terrain/bin/terrain" config > "$RUNNER_TEMP/scenario.yaml"

  # The Python package: one abi3 wheel (cp310-abi3), built once and tested on the oldest and the
  # newest supported CPython. The C API (header, example) is tested by `cargo test` above.
  python-wheel:
    name: Python wheel (abi3, 3.10 + 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.10

      - name: Build the wheel
        working-directory: bindings/python
        run: |
          python3.10 -m pip install "maturin>=1.9,<2"
          python3.10 -m maturin build --release -o dist
          ls dist

      # no GPU on the runner: tiles are generated on the CPU
      - name: Test on 3.10 and 3.13
        working-directory: bindings/python
        env:
          VK_DRIVER_FILES: /nonexistent.json
          VK_ICD_FILENAMES: /nonexistent.json
        run: |
          for v in 3.10 3.13; do
            python$v -m venv /tmp/venv$v
            /tmp/venv$v/bin/pip install dist/*.whl pytest
            /tmp/venv$v/bin/python -m pytest -q tests
          done

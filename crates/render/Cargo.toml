[package]
name = "render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Aerial sensor simulation over the generated planet: camera models, CPU / GPU renderer, sensor, events, IMU and HDF5 dataset output"

[dependencies]
geodesy.workspace = true
tilestore.workspace = true
terragen.workspace = true
h5.workspace = true
glam.workspace = true
serde.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
rayon.workspace = true
parking_lot.workspace = true
image.workspace = true
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[features]
default = ["gpu"]
# wgpu backend (headless) of the renderer
gpu = ["dep:wgpu", "dep:bytemuck"]

[[example]]
name = "gpu_probe"
required-features = ["gpu"]

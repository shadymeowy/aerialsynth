[package]
name = "terragen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Deterministic, lazily evaluable procedural planet: terrain, climate, drainage, land cover and towns as XYZ tiles (CPU and wgpu)"

[dependencies]
geodesy.workspace = true
tilestore.workspace = true
glam.workspace = true
serde.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
rayon.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[features]
default = ["gpu"]
# tile generation on the GPU (wgpu compute; needs 64-bit float and integer shader support)
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
image.workspace = true

[[example]]
name = "gpu_vs_cpu"
required-features = ["gpu"]

[package]
name = "terragen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Deterministic, lazily evaluable procedural planet: terrain, climate, drainage, land cover and towns as XYZ tiles (CPU and wgpu)"

[dependencies]
geodesy.workspace = true
tilestore.workspace = true
glam.workspace = true
serde.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
rayon.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# pins the GPU driver's libraries until the process ends (`gpu::device::pin_driver`)
libc = { version = "0.2", optional = true }

[features]
default = ["gpu"]
# tile generation on the GPU (wgpu compute; needs 64-bit float and integer shader support)
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:libc"]

[dev-dependencies]
image.workspace = true
# validates the generated WGSL of the class table (the version wgpu uses)
naga = { version = "30", features = ["wgsl-in"] }

[[example]]
name = "gpu_vs_cpu"
required-features = ["gpu"]

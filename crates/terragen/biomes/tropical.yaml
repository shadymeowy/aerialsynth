# Tropical and savanna kit (kits/tropical.rs, docs/kits/tropical.md): rainforest with emergent
# and flowering crowns, treefall gaps, river-edge forest, meander scars and a slash-and-burn
# frontier; flooded, monsoon and dry deciduous forest; acacia, baobab and palm savannas and
# miombo woodland with dry-season grass, burn scars, termite mounds, waterholes and gallery
# forests; cloud forest and páramo as altitudinal zones; mangroves on low tropical coasts.
#
# Schema: docs/design/kit-guide.md ("Biomes"). The kernels `tropical_*` are the kit's.
# Mangroves grow on the sea where it is shallower than ~5 m (water slot; the bed below sea
# level: no lakes inland) and on the coastal and delta flats below ~3 m, not on arid coasts. The
# atlas' coast distance (~20 km texels) misses the pixel coast by up to hundreds of km, so it is
# not used.

# ---------------------------------------------------------------- rainforest (core, patched)

- id: tropical_moist
  patch: true
  landuse: { agriculture: 0.2 }
  palette:
    crown_tropic: [30, 66, 30]
    crown_decid: [46, 78, 36]
    grass_wet: [70, 104, 40]
    laterite: [150, 74, 44]
    floor: [40, 50, 30]
  vegetation: { trees: 1.25, tropic: 0.3, laterite: 1.4, tall: 0.25 }
  canopy:
    # the closed canopy: broad cauliflower crowns of a stand, flat-topped where they close
    - { share: tropical, shape: umbrella, cell: 15, height: [22, 8], colour: crown_tropic }
    - { share: tropical, shape: umbrella, cell: 10, height: [18, 6], colour: [40, 74, 36], density: 0.6, seed: 0x7E01 }
    - { share: broadleaf, shape: dome, cell: 8.5, height: [10, 10], open_height: 0.65, colour: crown_decid, colour_dry: crown_dry }
    - { share: shrub, shape: dome, cell: 3.2, height: [1.6, 0], colour: shrub, closure: false, stand: false }
  zonation:
    - { below_c: 17.5, biome: tropical_cloud_forest }
    - { below_c: 10.0, biome: tropical_paramo }
  layers:
    # treefall gaps: bright regrowth, the canopy removed
    - slot: disturbance
      kernel: scatter
      mask: { natural: [0.4, 0.7, null, null], field: [null, null, 0.05, 0.2] }
      params: { cell: 120, density: 0.3, shape: dome, radius: [5, 14], height: [2, 7], jitter: 0.9, colour: [96, 128, 50], colour2: [120, 140, 64], second: 0.35, colour_var: 0.3 }
      clear: 1.0
    # slash-and-burn frontier: where farming begins, away from the fields
    - slot: disturbance
      kernel: tropical_swidden
      mask: { agri: [0.08, 0.22, 0.6, 0.85], field: [null, null, 0.03, 0.15], natural: [0.5, 0.8, null, null], patch: [0.1, 0.35, null, null] }
      params: { cell: 170, fill: 0.45, margin: 0.14, roughness: 0.2, height: 4, colour: [56, 48, 44], colour2: [152, 128, 90], fallow_colour: [104, 138, 54] }
      class: clear_cut
      clear: 1.0
    # meander scars of the floodplains: oxbow lakes, silted arcs, scroll bars
    - slot: disturbance
      kernel: tropical_meander
      seed: 0x7E10
      mask: { floodplain: [0.15, 0.35, null, null], river_dist: [null, null, 1500, 3500], slope: [null, null, 0.06, 0.12] }
      params: { cell: 1700, density: 0.85, part: lake, radius: [180, 420], width: 28, open: 0.7, size: 200, colour: [34, 46, 50], colour2: [84, 88, 72] }
      class: lake
      clear: 1.0
      height: blend
    - slot: canopy
      kernel: tropical_meander
      seed: 0x7E10
      mask: { floodplain: [0.15, 0.35, null, null], river_dist: [null, null, 1500, 3500], slope: [null, null, 0.06, 0.12], moist: [0.55, 0.7, null, null] }
      params: { cell: 1700, density: 0.85, part: scroll, radius: [180, 420], width: 28, open: 0.7, bars: 42, height: 20, size: 200, colour: [62, 96, 44], colour2: [44, 74, 38], silt_colour: [96, 122, 56] }
      class: tropical_rainforest
      height: blend
    # emergent giants above the canopy: pale crowns, some flowering yellow or pink-red
    - &emergents
      slot: canopy
      kernel: tropical_crowns
      mask: { veg: [0.5, 0.8, null, null], natural: [0.5, 0.8, null, null], field: [null, null, 0.05, 0.2], moist: [0.5, 0.65, null, null] }
      params: { cell: 34, density: 0.4, shape: umbrella, radius: [8, 13], height: [33, 42], colour: [70, 98, 50], colour2: [182, 160, 58], second: 0.1, flowering: 0.08, flower_colour: [172, 92, 100], colour_var: 0.3 }
      class: tropical_rainforest
    # river-edge forest: a lower band of pale pioneer crowns (Cecropia) along the banks
    - slot: canopy
      kernel: tropical_crowns
      mask: { river_dist: [null, null, 15, 45], natural: [0.4, 0.7, null, null], field: [null, null, 0.05, 0.2] }
      params: { cell: 7, density: 0.95, radius: [3, 5], height: [14, 22], colour: [88, 110, 74], colour2: [56, 90, 44], second: 0.5, colour_var: 0.3 }
      class: tropical_rainforest
      height: blend
    # mangroves on the shallow tidal shores of low coasts and estuaries (water slot: on the
    # sea shallower than ~5 m; tidal creeks stay open water)
    - &mangrove
      slot: water
      kernel: tropical_mangrove
      seed: 0x7E20
      mask: { height: [-7.0, -4.0, 0.0, 1.5], moist: [0.4, 0.55, null, null], temp: [20, 22, null, null] }
      params: { scale: 420, width: 9, height: 12, crown: 4.5 }
      class: mangrove
    # ... and on the land flats of the coast and the deltas near sea level, cut by creeks
    - &mangrove_land
      slot: canopy
      kernel: tropical_mangrove
      seed: 0x7E20
      mask: { height: [null, null, 1.5, 3.5], slope: [null, null, 0.02, 0.05], moist: [0.4, 0.55, null, null], temp: [20, 22, null, null] }
      params: { scale: 420, width: 9, height: 12, crown: 4.5 }
      class: mangrove


      mask: { slope: [null, null, 0.06, 0.12], river_dist: [null, null, 1200, 2500] }
      params: { cell: 2200, density: 0.6, part: lake, radius: [160, 380], width: 26, open: 0.8, size: 200, colour: [26, 30, 28], colour2: [70, 70, 54] }
      class: lake
      clear: 1.0

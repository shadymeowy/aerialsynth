  vegetation: { trees: 0.1, shrubs: 0.4, savanna: 0.3, meadow: 0.1, woodlots: 0.0 }
  landuse: { agriculture: 0.05, towns: 0.3 }
  layers:
    # blocks and slabs of the rock pavement

# Desert kit (docs/next/kits/desert.md): hot and cold deserts by palette and lithology. The landforms
# (dunes by wind regime, barchans, playas, washes, yardangs, inselbergs) are the kit's code and
# follow the climate; these biomes give each desert ecoregion its colours and ground textures:
# desert varnish, gravel mottling, rock pavement, scrub along the washes, oasis groves.
#
# Schema: docs/next/kit-guide.md ("Biomes"). Colours are sRGB 0..255.
#
# Masks used below: sand (the sand-sea mask), slope (tan), moist (0..1), river_dist (m from the
# bank of a channel, negative inside), patch (pixel noise ~[-1, 1]), temp (°C).

# ---- the core deserts: the kit's ground textures
- id: desert
  patch: true
  # (the kit's deserts share the BWh / BWk sites with it: the variety budget of the desert
  # biomes together is ~6 % of the land)
  min_share: 0.012
  layers:
    # desert varnish: dark brown patches on old, stable surfaces of the stony desert (reg)
    # (fewer and softer than they were: hundreds of metres of crisp dark and pale blots read as
    # camouflage from 1 km, where v0.2.0's desert floor is even)
    - slot: azonal
      kernel: patches
      mask: { sand: [null, null, 0.08, 0.2], slope: [null, null, 0.3, 0.45], moist: [null, null, 0.26, 0.36] }
      params: { scale: 240, fraction: 0.2, octaves: 3, roughness: 0.65, colour: [164, 136, 104], colour2: [154, 128, 98], colour_var: 0.2 }
      class: gravel
    # pale gravel and silt mottling of the pavement
    - slot: azonal
      kernel: patches
      mask: { sand: [null, null, 0.08, 0.2], slope: [null, null, 0.25, 0.4], moist: [null, null, 0.26, 0.36] }
      params: { scale: 28, fraction: 0.35, octaves: 2, roughness: 0.5, colour: [200, 182, 150], colour2: [186, 168, 140], colour_var: 0.15 }
    # sparse scrub on the plains
    - slot: canopy
      kernel: scatter
      mask: { sand: [null, null, 0.2, 0.4], moist: [0.03, 0.2, 2, 3], veg: [0.4, 0.7, 2, 3] }
      params: { cell: 9, density: 0.14, shape: dome, radius: [0.7, 1.5], height: [0.5, 1.3], colour: [96, 92, 64], colour2: [120, 108, 72], second: 0.4, colour_var: 0.3 }
      class: desert_scrub
    # acacia and tamarisk along the washes
    - slot: canopy
      kernel: scatter
      mask: { river_dist: [-15, 0, 20, 50], moist: [0.0, 0.08, 2, 3], veg: [0.4, 0.7, 2, 3] }
      params: { cell: 13, density: 0.45, shape: umbrella, radius: [1.8, 3.6], height: [2.5, 6], colour: [82, 90, 56], colour_var: 0.3 }
      class: desert_scrub
    # oases: date palm groves along some stretches of the washes, gardens under them
    - slot: agriculture
      kernel: cells
      mask: { river_dist: [null, null, 120, 220], patch: [0.3, 0.45, 2, 3], temp: [17, 21, 60, 70], veg: [0.4, 0.7, 2, 3] }
      params: { cell: 24, fill: 0.85, edge: 1.2, edge_height: 0.6, colour: [96, 118, 52], colour2: [138, 128, 82], edge_colour: [164, 140, 104], colour_var: 0.3 }
      class: crop
      clear: 1.0
    - slot: canopy
      kernel: scatter
      mask: { river_dist: [null, null, 110, 200], patch: [0.3, 0.45, 2, 3], temp: [17, 21, 60, 70], sand: [null, null, 0.4, 0.6] }
      params: { cell: 8, density: 0.8, shape: star, radius: [2.8, 4.2], height: [9, 16], colour: [56, 78, 42], colour2: [70, 88, 46], second: 0.3, colour_var: 0.25 }
      class: orchard


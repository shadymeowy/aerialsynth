# Moorland: heather moor burnt in strips of different ages (a patchwork of purple-brown and
# dark), grass moor, blanket bog and peat hags on the flats.
- id: moorland
  group: vegetation
  koppen: [Cfc, Cfb, Dfc]
  envelope: { temp: [-1, 9], precip_mm: [800, 4000] }
  weight: 0.35
  min_share: 0.0
  palette:
    soil: [[70, 56, 44], [84, 66, 50], [62, 52, 44], [98, 82, 64]]
    grass_wet: [124, 116, 72]
    grass_cold: [120, 112, 76]
  vegetation: { trees: 0.12, shrubs: 0.3 }
  layers:
    - slot: zonal
      kernel: cells
      params: { cell: 70, jitter: 0.85, fill: 0.75, aspect: 2.6, colour: [66, 54, 46], colour2: [106, 80, 82], colour_var: 0.2, edge: 0 }
      class: shrub
    - slot: zonal
      kernel: patches
      params: { scale: 260, fraction: 0.22, octaves: 3, colour: [142, 126, 82], colour2: [124, 112, 72], colour_var: 0.1, soft: 0.3 }
      class: grass
      height: none
    - slot: azonal
      kernel: patches
      mask: { slope: [-1, -1, 0.08, 0.15] }
      params: { scale: 36, fraction: 0.16, octaves: 3, roughness: 0.6, colour: [56, 44, 36], colour2: [74, 60, 48] }
      class: bog
      height: none
  landuse: { agriculture: 0.2, towns: 0.4 }

# ------------------------------------------------------------------ above the tree line

# Zones only (weight 0; the Köppen class and envelope keep them out of the nearest-envelope
# fallback of the ecoregion pick).

# Subalpine krummholz: the tree line, dwarf pine mats and stunted spruce among meadows.
- id: subalpine_krummholz
  group: vegetation
  koppen: [EF]
  envelope: { temp: [-99, -98] }
  weight: 0.0
  palette:
    grass_wet: [96, 118, 58]
    grass_cold: [112, 122, 78]
    crown_conifer: [32, 50, 36]
  vegetation: { trees: 0.55, conifer: 0.7, crown_scale: 0.65, tall: -0.5, shrubs: 1.6 }
  canopy:
    - { share: conifer, shape: cone, cell: 4.5, height: [7, 4], colour: [32, 50, 36], density: 0.7, closure: false }
    - { share: shrub, shape: dome, cell: 3.0, height: [1.2, 0], colour: [44, 64, 38], closure: false, stand: false }
  layers:
    - slot: altitudinal
      kernel: scatter
      mask: { natural: [0.3, 0.6, 2, 3], veg: [0.3, 0.6, 2, 3], slope: [-1, -1, 0.8, 1.1] }
      params: { cell: 7, density: 0.5, shape: dome, radius: [1.6, 3.4], height: [0.8, 1.8], jitter: 0.9, colour: [38, 60, 38], colour2: [52, 74, 42], second: 0.3, colour_var: 0.25, shade: 0.5 }
      class: shrub
      height: max


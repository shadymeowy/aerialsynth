  group: vegetation
  koppen: [BSk, Dfa, Dfb, Dsa, Dsb, Dwa]
  envelope: { precip_mm: [200, 560], temp: [-2, 14] }
  weight: 0.7
  min_share: 0.003
  palette:
    soil: [[72, 60, 50], [86, 70, 56], [98, 86, 72], [112, 96, 74]]
    grass_dry: [186, 178, 138]
    grass_wet: [128, 132, 80]
  vegetation: { trees: 0.15, shrubs: 0.6, groves: 0.3, meadow: 1.4 }
  layers:
    - slot: zonal
      kernel: patches
      params: { scale: 32, fraction: 0.82, octaves: 3, roughness: 0.55, colour: [198, 192, 158], colour2: [170, 160, 116], colour_var: 0.14, soft: 0.3 }
      class: steppe
      height: none
    - slot: zonal

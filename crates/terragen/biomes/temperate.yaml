      height: max

# ------------------------------------------------------------------ core biomes

# the classes of the core steppe: steppe grassland
- id: steppe
  patch: true
  layers:
    - slot: zonal
      kernel: patches
      # (most of the ground: at 62 % the green grass between drew a camouflage of yellow and
      # green blotches, audit a18; a soft blend, not a threshold: crisp-edged blobs of the two
      # colours a hundred metres across still read as camouflage)
      params: { scale: 40, fraction: 0.85, octaves: 3, roughness: 0.5, colour: grass_dry, colour2: [150, 146, 100], colour_var: 0.12, soft: 0.5 }
      class: steppe
      height: none

# the core boreal forest: heath and reindeer-lichen openings where the soil is thin, on the
# steeper slopes and knolls, and bare granite on the steepest (a closed canopy over every hill
# read as a monotone dark forest sea, boreal@type)
- id: boreal
  patch: true
  layers:
    # (in the hills and mountains, more on the ridges and spurs than in the valleys (the erosion
    # relief's smooth gully signal), in soft-edged areas hundreds of metres across: masked by the
    # pixel's slope, the micro relief broke them into a pale speckle on every slope, boreal@type,
    # and into blotches over the flat lowland forests, fp_forest)
    - slot: disturbance
      kernel: patches
      mask: { mountain: [0.12, 0.35, null, null], gully: [-0.35, 0.25, null, null], natural: [0.3, 0.6, 2, 3], field: [-1, -1, 0.2, 0.5] }
      params: { scale: 520, fraction: 0.5, octaves: 2, roughness: 0.45, colour: [146, 136, 112], colour2: [118, 114, 92], colour_var: 0.12, soft: 0.45 }
      class: shrub
      clear: 0.6
      height: none
    - slot: disturbance
      kernel: patches
      mask: { mountain: [0.25, 0.5, null, null], gully: [0.1, 0.6, null, null], natural: [0.3, 0.6, 2, 3] }
      params: { scale: 160, fraction: 0.2, octaves: 2, roughness: 0.5, colour: [132, 128, 120], colour2: [104, 102, 96], colour_var: 0.15, soft: 0.3 }
      class: rock
      clear: 1.0
      height: none

# altitudinal zones of the core temperate and Mediterranean biomes
- id: temperate
  patch: true
  zonation:
    - { below_c: 1.0, biome: subalpine_krummholz }
    - { below_c: -1.5, biome: alpine_meadow }
- id: temperate_broadleaf
  patch: true
  zonation:
    - { below_c: 5.0, biome: mixed_forest }
    - { below_c: 1.0, biome: subalpine_krummholz }
    - { below_c: -1.5, biome: alpine_meadow }
- id: temperate_conifer
  patch: true
  zonation:
    - { below_c: 1.0, biome: subalpine_krummholz }
    - { below_c: -1.5, biome: alpine_meadow }
- id: mediterranean
  patch: true
  zonation:
    - { below_c: 9.0, biome: mixed_forest }
    - { below_c: 1.0, biome: subalpine_krummholz }
    - { below_c: -1.5, biome: alpine_meadow }

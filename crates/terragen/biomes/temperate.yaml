# Temperate, boreal and wetland kit (`src/kits/temperate.rs`, `docs/next/kits/temperate.md`):
# forest types, Mediterranean scrub, steppe, heath and moor, and the altitudinal zones above
# the tree line. Wetlands, forestry (clear-cuts, windthrow, firebreaks, logging roads) and
# autumn colours are drawn by the kit's layer functions (climate- and terrain-driven, in every
# biome where they fit).
#
# Schema: docs/next/kit-guide.md ("Biomes").

# ------------------------------------------------------------------ forests

# Broadleaf deciduous forest: v0.2.0's crowns of 10-20 m (one layer closing the canopy, gaps
# of shaded floor between the crowns) and a few larger, paler old oaks and beeches; few
# conifers. (Three layers of 6-10 m cells closed every gap: a fine, dark, glittering canopy.)
# Autumn colours: the kit's canopy layer, by the ecoregion's season.
- id: broadleaf_deciduous
  group: forest
  koppen: [Cfa, Cfb, Dfa, Dfb, Dwa, Cwa]
  weight: 0.7
  min_share: 0.004
  palette:
    grass_wet: [78, 112, 44]
    crown_decid: [56, 86, 36]
    crown_dry: [92, 100, 56]
    floor: [86, 76, 52]
  vegetation: { trees: 1.3, conifer: -0.65, tall: 0.15, woodlots: 1.3, crown_scale: 0.82 }
  canopy:
    - { share: broadleaf, shape: dome, cell: 8.5, height: [12, 10], open_height: 0.65, colour: [46, 74, 32], colour_dry: crown_dry }
    - { share: broadleaf, shape: dome, cell: 13.0, height: [14, 10], open_height: 0.65, colour: [72, 100, 42], density: 0.15, seed: 0x7D01 }
    - { share: conifer, shape: cone, cell: 5.5, height: [17, 10], colour: crown_conifer }
    - { share: shrub, shape: dome, cell: 3.2, height: [1.6, 0], colour: shrub, closure: false, stand: false }
  zonation:
    - { below_c: 6.0, biome: mixed_forest }
    - { below_c: 1.0, biome: subalpine_krummholz }
    - { below_c: -1.5, biome: alpine_meadow }

# Mixed forest: stands of spruce, pine, birch and oak side by side (the canopy model mixes
# them per stand: needleleaf, broadleaf and mixed stands).
- id: mixed_forest
  group: forest
  koppen: [Dfb, Dwb, Dsb, Cfb]
  weight: 0.6
  min_share: 0.004
  palette:
    grass_wet: [82, 108, 50]
    crown_conifer: [30, 48, 36]
    crown_decid: [62, 90, 40]
  vegetation: { trees: 1.25, conifer: -0.1, woodlots: 1.2 }
  canopy:
    - { share: conifer, shape: cone, cell: 5.0, height: [17, 10], colour: [28, 46, 34], density: 0.8 }
    - { share: conifer, shape: dome, cell: 7.0, height: [18, 8], colour: [44, 62, 38], density: 0.4 }
    - { share: broadleaf, shape: dome, cell: 6.5, height: [13, 8], open_height: 0.7, colour: [80, 106, 50], density: 0.55 }
    - { share: broadleaf, shape: dome, cell: 9.5, height: [15, 9], open_height: 0.65, colour: [52, 80, 34], colour_dry: crown_dry, density: 0.5 }
    - { share: shrub, shape: dome, cell: 3.2, height: [1.6, 0], colour: shrub, closure: false, stand: false }
  zonation:
    - { below_c: 1.0, biome: subalpine_krummholz }
    - { below_c: -1.5, biome: alpine_meadow }

# Boreal taiga: dark narrow spruce spires and lighter pines over a pale moss and lichen floor,
# birch and aspen in the young stands.
- id: taiga
  group: forest
  koppen: [Dfc, Dfd, Dwc, Dwd, Dsc]
  weight: 0.9
  min_share: 0.004
  palette:
    soil: [[118, 110, 98], [128, 116, 100], [104, 100, 94], [146, 136, 118]]
    grass_wet: [96, 106, 64]
    grass_cold: [116, 118, 88]
    crown_conifer: [24, 38, 30]
    floor: [128, 132, 104]
  vegetation: { trees: 1.05, conifer: 0.55, crown_scale: 0.72, tall: -0.15 }
  canopy:
    - { share: conifer, shape: cone, cell: 4.2, height: [14, 8], colour: [24, 38, 30], density: 0.8 }
    - { share: conifer, shape: cone, cell: 6.5, height: [16, 8], colour: [40, 54, 36], density: 0.35 }
    - { share: broadleaf, shape: dome, cell: 5.5, height: [11, 6], open_height: 0.8, colour: [74, 98, 46], colour_dry: crown_dry, density: 0.9 }
    - { share: shrub, shape: dome, cell: 2.8, height: [1.0, 0], colour: [70, 78, 52], closure: false, stand: false }
  layers:
    # moss and reindeer lichen between the trees (closer in tone: pale lichen against moss at
    # 14 m speckled the open taiga, audit a26 a17; and darker: a pale floor between the dark
    # crowns read as salt-and-pepper noise)
    - slot: zonal
      kernel: patches
      params: { scale: 14, fraction: 0.45, octaves: 2, colour: [120, 124, 94], colour2: [104, 112, 80], colour_var: 0.06 }
      mask: { temp: [-12, 6] }
      height: none
    # heath and reindeer-lichen openings where the soil is thin, on the steeper slopes and knolls,
    # and bare granite on the steepest (a closed canopy over every hill read as a monotone dark
    # forest sea, boreal@type)
    # (in the hills and mountains, more on the ridges and spurs than in the valleys (the erosion
    # relief's smooth gully signal), in soft-edged areas hundreds of metres across: masked by the
    # pixel's slope, the micro relief broke them into a pale speckle on every slope, boreal@type,
    # and into blotches over the flat lowland forests, fp_forest)
    - slot: disturbance
      kernel: patches
      mask: { mountain: [0.12, 0.35, null, null], gully: [-0.35, 0.25, null, null], natural: [0.3, 0.6, 2, 3], field: [-1, -1, 0.2, 0.5] }
      params: { scale: 520, fraction: 0.5, octaves: 2, roughness: 0.45, colour: [146, 136, 112], colour2: [118, 114, 92], colour_var: 0.12, soft: 0.45 }
      class: shrub
      clear: 0.6
      height: none
    - slot: disturbance
      kernel: patches
      mask: { mountain: [0.25, 0.5, null, null], gully: [0.1, 0.6, null, null], natural: [0.3, 0.6, 2, 3] }
      params: { scale: 160, fraction: 0.2, octaves: 2, roughness: 0.5, colour: [132, 128, 120], colour2: [104, 102, 96], colour_var: 0.15, soft: 0.3 }
      class: rock
      clear: 1.0
      height: none
    # open spruce taiga where it is too dry for the canopy model's forest
    - slot: canopy
      kernel: scatter
      mask: { natural: [0.3, 0.6, 2, 3], veg: [0.3, 0.6, 2, 3], field: [-1, -1, 0.2, 0.5], moist: [0.1, 0.16, 0.3, 0.42] }
      params: { cell: 6, density: 0.6, shape: cone, radius: [1.2, 2.1], height: [8, 16], jitter: 0.9, colour: [24, 38, 30], colour2: [40, 54, 36], second: 0.3, colour_var: 0.2, shade: 0.5 }
      class: needleleaf_forest

# Lichen woodland: widely spaced spruce spires on cream-white reindeer lichen (the dry
# continental north).
- id: lichen_woodland
  group: forest
  koppen: [Dfc, Dfd, Dwc, Dwd]
  envelope: { precip_mm: [0, 560] }
  weight: 0.6
  min_share: 0.002
  palette:
    soil: [[150, 142, 124], [138, 128, 110], [120, 114, 104], [164, 156, 136]]
    grass_cold: [150, 148, 116]
    crown_conifer: [26, 40, 32]
    floor: [176, 174, 146]
  vegetation: { trees: 0.75, conifer: 0.8, crown_scale: 0.62, tall: -0.3, shrubs: 0.5 }
  canopy:
    - { share: conifer, shape: cone, cell: 7.5, height: [11, 6], colour: [26, 40, 32], density: 0.75, closure: false }
    - { share: broadleaf, shape: dome, cell: 6.0, height: [7, 4], colour: [86, 104, 56], density: 0.5, closure: false }
    - { share: shrub, shape: dome, cell: 3.0, height: [0.8, 0], colour: [76, 82, 56], closure: false, stand: false }
  layers:
    - slot: zonal
      kernel: patches
      params: { scale: 9, fraction: 0.8, octaves: 2, roughness: 0.55, colour: [204, 202, 176], colour2: [172, 172, 140], colour_var: 0.12 }
      class: woodland
      height: none
    # the spruce spires stand on the lichen where it is too dry for the canopy model's forest
    - slot: canopy
      kernel: scatter
      mask: { natural: [0.3, 0.6, 2, 3], veg: [0.3, 0.6, 2, 3], field: [-1, -1, 0.2, 0.5], moist: [0.05, 0.12, 0.3, 0.42] }
      params: { cell: 8, density: 0.55, shape: cone, radius: [1.1, 2.0], height: [6, 12], jitter: 0.9, colour: [26, 40, 32], colour2: [40, 54, 36], second: 0.3, colour_var: 0.2, shade: 0.5 }
      class: needleleaf_forest

# ------------------------------------------------------------------ Mediterranean scrub

# Maquis: dense mottled scrub of olive-grey and dark green shrubs (holm oak, lentisk, strawberry
# tree), stone pines and holm oaks, terracotta soils between.
- id: maquis
  group: vegetation
  koppen: [Csa, Csb]
  weight: 0.8
  min_share: 0.003
  palette:
    soil: [[170, 100, 64], [182, 116, 76], [152, 106, 80], [194, 146, 104]]
    grass_dry: [178, 160, 110]
    shrub: [92, 100, 70]
    crown_decid: [60, 78, 46]
    crown_dry: [96, 102, 68]
    crown_conifer: [50, 70, 42]
  vegetation: { trees: 0.5, shrubs: 1.0, conifer: 0.15, groves: 1.4, meadow: 0.6 }
  canopy:
    - { share: broadleaf, shape: dome, cell: 7.0, height: [6, 4], open_height: 1.0, colour: [60, 78, 46], colour_dry: crown_dry, density: 0.9 }
    - { share: conifer, shape: umbrella, cell: 10.0, height: [12, 5], colour: [50, 70, 42], density: 0.6 }
    - { share: shrub, shape: dome, cell: 2.6, height: [1.4, 0], colour: [96, 104, 72], closure: false, stand: false }
  layers:
    - slot: canopy
      kernel: scatter
      mask: { natural: [0.3, 0.6, 2, 3], veg: [0.3, 0.6, 2, 3], field: [-1, -1, 0.2, 0.5], moist: [0.12, 0.6] }
      params: { cell: 3.4, density: 0.95, shape: dome, radius: [1.1, 2.0], height: [1.2, 3.2], jitter: 0.85, colour: [112, 114, 90], colour2: [66, 78, 54], second: 0.45, colour_var: 0.3, shade: 0.5 }
      class: maquis
    - slot: azonal
      kernel: patches
      mask: { slope: [0.12, 0.3, 9, 10] }
      params: { scale: 16, fraction: 0.14, colour: [196, 188, 170], colour2: [170, 160, 142] }
      class: rock
      height: none
  zonation:
    - { below_c: 9.0, biome: mixed_forest }
    - { below_c: 1.0, biome: subalpine_krummholz }
    - { below_c: -1.5, biome: alpine_meadow }


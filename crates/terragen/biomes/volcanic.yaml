    rock: [[46, 42, 44], [60, 54, 52], [34, 32, 34]]
    sand: [[74, 70, 68], [58, 56, 56], [92, 86, 80]]
    beach: [54, 50, 50]
    wet_sand: [30, 28, 30]
    tundra: [96, 98, 72]
    grass_cold: [92, 96, 70]
  vegetation: { trees: 0.25, conifer: 0.5, shrubs: 0.5, meadow: 0.5, woodlots: 0.1 }
  layers:
    - slot: azonal
      kernel: lobes
      mask: { volcanism: [0.28, 0.55, null, null], slope: [null, null, 0.6, 0.9] }
      params: { cell: 800, density: 0.4, radius: [260, 600], span: 1.3, margin: 0.3, channels: 5, height: 0, colour: [66, 58, 54], colour2: [88, 74, 62] }
      class: bare
      height: none
      clear: 0.8
    - slot: azonal
      kernel: lobes
      mask: { volcanism: [0.4, 0.7, null, null], slope: [null, null, 0.6, 0.9] }
      params: { cell: 1100, density: 0.35, radius: [300, 700], span: 1.2, margin: 0.25, channels: 6, height: 0, colour: [22, 20, 22], colour2: [50, 40, 38] }
      class: lava
      height: none
      clear: 1.0
  landuse: { agriculture: 0.02, towns: 0.2 }

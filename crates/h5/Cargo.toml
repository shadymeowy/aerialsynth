[package]
name = "h5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Small safe wrapper over the HDF5 C library (statically linked hdf5-sys): files, groups, N-d datasets, attributes"

[dependencies]

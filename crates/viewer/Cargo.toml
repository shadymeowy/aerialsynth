[package]
name = "viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "`terrain view`: map (globe of the tile store) and camera (the dataset renderer, live), flown in realtime"

[dependencies]
geodesy.workspace = true
tilestore.workspace = true
terragen.workspace = true
render.workspace = true
glam.workspace = true
anyhow.workspace = true
rayon.workspace = true
clap.workspace = true
parking_lot.workspace = true
bytemuck.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
serde.workspace = true
serde_yaml.workspace = true
half = { version = "2", features = ["bytemuck"] }
pollster.workspace = true
image.workspace = true

[dev-dependencies]
# validates the shaders without a GPU (the version wgpu uses)
naga = { version = "30", features = ["wgsl-in"] }

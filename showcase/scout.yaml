# Candidate places found by scanning the planet (probe_px scan) and checking their tiles.
# Stills: python showcase/make_showcase.py --stills --story showcase/scout.yaml
video: { width: 1280, height: 720, fps: 25, crossfade: 0.6, title: aerialsynth, subtitle: candidates, tagline: '' }
shots:
  - id: alpine_south
    label: "Glaciated massif · 33°S"
    text: "High ridges, cirques and gullies under snow"
    seconds: 5
    scenario:
      trajectory: { synth: { kind: line, lat: -33.5, lon: -171.0, heading_deg: 60, altitude_m: 1200 } }
      render: { lighting: { time_utc: "02:54:00" } }
      cameras: [ { extrinsics: { pitch_deg: -30 } } ]


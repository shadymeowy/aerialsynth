# The opening of the airliner video (showcase/airliner.yaml): the planet turns to the route's
# hemisphere and holds while make_airliner.py draws the route over it, then the camera dives
# to the departure, a lake district on the equator (1.3°N 103.9°W). The field of view stays
# 40° (the overlay projects the route with it).
keys:
  - { t: 0.0,  lat: 10.0, lon: -40.0,  km: 18000 }
  - { t: 4.0,  lat: 36.0, lon: -126.0, km: 12500 }
  - { t: 10.0, lat: 38.0, lon: -129.0, km: 11500 }
  - { t: 13.0, lat: 8.0,  lon: -106.0, km: 2500,  heading: 15, tilt: 15 }
  - { t: 15.5, lat: 1.0,  lon: -104.0, km: 120,   heading: 20, tilt: 45 }
  - { t: 17.5, lat: 1.2,  lon: -103.93, km: 10,   heading: 20, tilt: 65 }
look:
  - { t: 0.0, mode: surface }

      extrinsics: {mount: forward, pitch_deg: -25}
      rgb: null
      events: {supersample: 1}
    trajectory:
      synth: {kind: line, lat: -26.00742, lon: 32.99572, heading_deg: 105, altitude: 1300, speed: 60}
    render:
      lighting: {time_utc: '07:20:00'}
  seconds: 6.5
  text: Depth and flow over the river valleys; events along every edge
  extend: 6.6
- {id: events_rivers, label: Event camera · rivers, text: 'Edges of rivers, fields and forest as a stream of events', seconds: 6, layout: events,
  source: modalities_rivers, offset: 7.1}
- id: terminal_lake
  label: River-fed lake
  text: Rivers draining into a lake in a closed basin
  seconds: 6
  scenario:
    trajectory:
      synth: {kind: line, lat: 40.95138, lon: 33.88939, heading_deg: 135, altitude: 1500}
    render:
      lighting: {time_utc: '07:45:00'}
    cameras:
    - extrinsics: {pitch_deg: -35}
- id: tropics
  label: Tropics
  text: Plantations, rainforest and a river delta on a tropical coast
  seconds: 6.5
  scenario:
    trajectory:
      synth: {kind: line, lat: 3.47675, lon: -103.43456, heading_deg: 215, altitude: 1000, speed: 60}
    render:
      lighting: {time_utc: '16:20:00'}
    cameras:
    - extrinsics: {pitch_deg: -32}
- id: fisheye
  label: Fisheye · 200°
  scenario:
    cameras:
    - extrinsics: {mount: nadir, pitch_deg: 35}
      intrinsics:
        distortion: [0.0, 0.0, 0.0, 0.0]
        height: 1080
        intrinsics: [307.5, 307.5, 539.5, 539.5]
        max_fov_deg: 200
        model: kannala_brandt
        width: 1080
    trajectory:
      synth: {altitude: 1400, heading_deg: 90, kind: line, lat: 7.0, lon: -102.0}
    render:
      lighting: {time_utc: '16:48:00'}
  seconds: 5
  text: 'Kannala–Brandt fisheye: wider than a hemisphere'
- id: dunes
  label: Sand sea · 15°N
  scenario:
    cameras:
    - extrinsics: {pitch_deg: -25}
    render:
      lighting: {time_utc: '00:55:00', date: '2026-06-22'}
    trajectory:
      synth: {altitude: 700, heading_deg: 120, kind: line, lat: 15.0, lon: -111.38, speed: 60}
  seconds: 6
  text: 'Sand seas: transverse and star dunes in low evening light'
- id: models
  label: Camera models
  layout: grid
  panels: [Pinhole · 70°, Pinhole · strong radial distortion, Kannala–Brandt · 190°, Mei omnidirectional · 200°]
  scenario:
    cameras:
    - extrinsics: {mount: forward, pitch_deg: -40}
      intrinsics:
        height: 540
        intrinsics: [685.5, 685.5, 479.5, 269.5]
        model: pinhole
        width: 960
      path: /pinhole
      rgb: {}
    - extrinsics: {mount: forward, pitch_deg: -40}
      intrinsics:
        distortion: [-0.32, 0.09, 0.0, 0.0]
        height: 540
        intrinsics: [450.0, 450.0, 479.5, 269.5]
        model: pinhole
        width: 960
      path: /barrel
      rgb: {}
    - extrinsics: {mount: forward, pitch_deg: -40}
      intrinsics:
        distortion: [0.0, 0.0, 0.0, 0.0]
        height: 540
        intrinsics: [187.5, 187.5, 479.5, 269.5]
        max_fov_deg: 190
        model: kannala_brandt
        width: 960
      path: /kb
      rgb: {}
    - extrinsics: {mount: forward, pitch_deg: -40}
      intrinsics:
        distortion: [0.0, 0.0, 0.0, 0.0]
        height: 540
        intrinsics: [345.0, 345.0, 479.5, 269.5]
        max_fov_deg: 200
        model: mei
        width: 960
        xi: 1.3
      path: /mei
      rgb: {}
    trajectory:
      synth: {altitude: 800, heading_deg: 352, kind: line, lat: 40.276, lon: 36.834}
    render:
      lighting: {time_utc: '06:00:00'}
  seconds: 5.5
  text: 'Four camera models from the same pose: pinhole, radial distortion, fisheye, omnidirectional'
- id: boreal
  label: Boreal · 53°N
  text: Spruce forest, bogs and a river in the north
  seconds: 6
  scenario:
    trajectory:
      synth: {kind: line, lat: 52.97924, lon: -16.41426, heading_deg: 60, altitude: 900}

# Showcase storyboard. Every shot is rendered by `terrain` from base.yaml + its `scenario`
# overrides (deep merge) and composed by make_showcase.py.
#
#   label:    small caption, bottom left          text: feature description, bottom right
#   seconds:  shown duration (shots cross-fade by `video.crossfade` seconds)
#   layout:   single (default) | grid (2x2 of four cameras) | modalities | map
#   speedup:  time-lapse factor for the flight (frames are rendered every speedup/fps seconds)
#
# Times are UTC; local solar time here (33°E) is UTC + 2h12.

video:
  width: 1920
  height: 1080
  fps: 25
  crossfade: 0.6
  title: "aerialsynth"
  subtitle: "A procedural planet for aerial vision"
  tagline: "Every frame below is rendered from generated tiles — no imagery, no elevation data."

shots:
- id: volcano
  label: Rainforest peak
  scenario:
    cameras:
    - extrinsics: {pitch_deg: -25}
    render:
      lighting: {time_utc: '16:48:00'}
    trajectory:
      synth: {altitude: 1400, heading_deg: 90, kind: line, lat: 7.0, lon: -102.0}
  seconds: 5
  text: A lone peak rising out of the rainforest
- id: modalities_mountains
  label: Ground truth · mountains
  layout: modalities
  scenario:
    cameras:
    - depth: {}
      extrinsics: {mount: forward, pitch_deg: -24}
      flow: {}
      intrinsics:
        model: pinhole
        width: 1920
        height: 1080
        intrinsics: [1371.0, 1371.0, 959.5, 539.5]
      path: /cam0
      rgb: {}
    - path: /events
      intrinsics:
        model: pinhole
        width: 1280
        height: 720
        intrinsics: [914.0, 914.0, 639.5, 359.5]
      extrinsics: {mount: forward, pitch_deg: -24}
      rgb: null
      events: {supersample: 1}
    imu: {path: /imu}
    trajectory:
      synth: {altitude: 1100, heading_deg: 80, kind: line, lat: 39.17, lon: 33.7, speed: 70}
    render:
      lighting: {time_utc: '04:45:00'}
  seconds: 6
  text: Every pixel comes with depth, optical flow and events — plus IMU and poses
  extend: 6.6
- {id: events_mountains, label: Event camera · mountains, text: 'At sunrise every ridge and gully fires: microsecond events, no motion blur',
  seconds: 6, layout: events, source: modalities_mountains, offset: 6.6}
- id: golden
  label: Golden hour
  scenario:
    cameras:
    - extrinsics: {pitch_deg: -14}
    render:
      lighting: {time_utc: '16:08:00'}
    trajectory:
      synth: {altitude: 700, heading_deg: 20, kind: line, lat: 39.25, lon: 33.95}
  seconds: 6
  text: 'A real solar ephemeris: date, time and place set the light'
- id: dusk
  label: Day to night · time-lapse
  scenario:
    cameras:
    - extrinsics: {pitch_deg: -34}
      rgb:
        sensor:
          # one fixed exposure for the whole time-lapse (16 ms, no gain), so the scene really
          # darkens: an auto exposure (gain 160) brightened the night back to day
          exposure: {mode: manual, ev: 4.0, max_gain: 1, max_time: 0.04}
    render:
      lighting: {time_scale: 600, time_utc: '16:50:00'}
    trajectory:
      synth: {altitude: 900, heading_deg: 90, kind: line, lat: 39.894, lon: 32.912, speed: 40}
  seconds: 7
  text: 'A continuous day cycle: twilight, and the lamps switching on'
- id: night
  label: Night · towns
  scenario:
    cameras:
    - extrinsics: {pitch_deg: -28}
      rgb:
        sensor:
          exposure: {max_gain: 64, max_time: 0.008, target: 0.012}
          noise: {read: 0.04, shot: 0.06}
          optics: {bloom: 0.02, chromatic_aberration_px: 0.0, defocus_px: 0.0}
    render:
      lighting: {date: '2026-03-19', time_utc: '21:30:00'}
    trajectory:
      synth: {altitude: 1500, heading_deg: 75, kind: line, lat: 41.562, lon: 32.955, speed: 50}
  seconds: 6
  text: 'A town at night from a plane: street lamps, windows and the glow of the haze'
- id: moon
  label: Full moon
  scenario:
    cameras:
    - extrinsics: {pitch_deg: -8}
      rgb:
        sensor:
          exposure: {max_gain: 64, max_time: 0.04, target: 0.06}
          noise: {read: 0.03, shot: 0.05}
          optics: {bloom: 0.03}
    render:
      lighting: {date: '2026-03-03', moon_intensity: 40.0, time_utc: '17:40:00'}
    trajectory:
      synth: {altitude: 1300, heading_deg: 95, kind: line, lat: 39.17, lon: 33.62}
  seconds: 6
  text: Moonlight and the lunar disc from the true lunar position and phase
- id: stars
  label: Night sky · real stars and planets
  scenario:
    cameras:
    - path: /cam0
      intrinsics: {model: pinhole, width: 1920, height: 1080, intrinsics: [960.0, 960.0, 959.5, 539.5]}
      extrinsics: {mount: forward, pitch_deg: 38}
      rgb:
        sensor:
          # a sensitive night camera: fast optics (base_time), 40 ms, gain 4
          exposure: {mode: manual, ev: 14.97, base_time: 5.0e-6, max_time: 0.04, max_gain: 4}
          noise: {read: 0.03, shot: 0.05}
          optics: {bloom: 0.03, defocus_px: 0.9, starburst: 0.25}
    - path: /events
      intrinsics: {model: pinhole, width: 1280, height: 720, intrinsics: [640.0, 640.0, 639.5, 359.5]}
      extrinsics: {mount: forward, pitch_deg: 38}
      rgb: null
      events: {supersample: 1, shot_noise_dark_gain: 3.0}
    render:
      lighting: {date: '2026-01-10', time_utc: '20:15:00'}
    trajectory:
      synth: {altitude: 1500, heading_deg: 140, kind: line, lat: 41.562, lon: 32.955, speed: 50}
  seconds: 6
  extend: 6.6
  text: 'The real sky of 2026-01-10 20:15 UTC: Hipparcos + Tycho-2 stars and JPL DE440 planets (Jupiter, Orion, Sirius), astrometric error < 0.01″'
- {id: events_stars, label: Event camera · night sky, text: 'The same sky on an event camera: stars and Jupiter fire events as the aircraft vibrates, at their true positions', seconds: 6, layout: events,
  source: stars, offset: 6.6}
- id: modalities_night
  label: Ground truth · night
  layout: modalities
  scenario:
    cameras:
    - depth: {}
      extrinsics: {mount: forward, pitch_deg: -28}
      flow: {}
      intrinsics:
        model: pinhole
        width: 1920
        height: 1080
        intrinsics: [1371.0, 1371.0, 959.5, 539.5]
      path: /cam0
      rgb:
        sensor:
          exposure: {max_gain: 64, max_time: 0.008, target: 0.012}
          noise: {read: 0.04, shot: 0.06}
          optics: {bloom: 0.02, chromatic_aberration_px: 0.0, defocus_px: 0.0}
    - path: /events
      intrinsics:
        model: pinhole
        width: 1280
        height: 720
        intrinsics: [914.0, 914.0, 639.5, 359.5]
      extrinsics: {mount: forward, pitch_deg: -28}
      rgb: null
      events: {supersample: 1, shot_noise_dark_gain: 3.0}
    trajectory:
      synth: {altitude: 1500, heading_deg: 75, kind: line, lat: 41.562, lon: 32.955, speed: 50}
    render:
      lighting: {date: '2026-03-19', time_utc: '21:30:00'}
  seconds: 6
  text: 'Event cameras at night: street lamps fire bright, sharp events'
  extend: 6.6
- {id: events_night, label: Event camera · night, text: 'Street lamps at night: high dynamic range, sharp events in the dark', seconds: 6, layout: events,
  source: modalities_night, offset: 6.6}
- id: star_tracker
  label: Star tracker · ground truth
  star_overlay: {mag: 5.0}
  scenario:
    cameras:
    - path: /cam0
      intrinsics: {model: pinhole, width: 1920, height: 1080, intrinsics: [4330.0, 4330.0, 959.5, 539.5]}
      extrinsics: {mount: forward, pitch_deg: 45, yaw_deg: -4}
      stars: {mag_limit: 9}
      rgb:
        sensor:
          # a star tracker: 25 deg lens, fast optics (base_time), 40 ms, gain 4, slightly defocused
          exposure: {mode: manual, ev: 13.97, base_time: 1.0e-5, max_time: 0.04, max_gain: 4}
          noise: {read: 0.03, shot: 0.05}
          optics: {bloom: 0.0, defocus_px: 1.0, starburst: 0.0, vignette: 0.0, chromatic_aberration_px: 0.0}
    - path: /events
      intrinsics: {model: pinhole, width: 1280, height: 720, intrinsics: [2887.0, 2887.0, 639.5, 359.5]}
      extrinsics: {mount: forward, pitch_deg: 45, yaw_deg: -4}
      rgb: null
      events: {supersample: 1, shot_noise_dark_gain: 3.0}
    render:
      lighting: {date: '2026-01-20', time_utc: '19:30:00'}
    trajectory:
      synth: {altitude: 1500, heading_deg: 190, kind: line, lat: 41.5705, lon: 32.970, speed: 50}
  seconds: 6
  extend: 6.6
  text: 'A star tracker on the plane: rings mark the catalogue ground truth (sub-pixel), trails follow the airframe vibration'
- {id: events_tracker, label: Event camera · star tracker, text: 'The tracker view as events: Orion''s belt and sword, every event at the true star positions', seconds: 6, layout: events,
  source: star_tracker, offset: 6.6}
- id: braided
  label: Rivers converging
  text: Big rivers meeting in a wooded hill country
  seconds: 6.5
  scenario:
    trajectory:
      synth: {kind: line, lat: -26.00742, lon: 32.99572, heading_deg: 105, altitude: 1300, speed: 60}
    render:
      lighting: {time_utc: '07:20:00'}
    cameras:
    - extrinsics: {pitch_deg: -25}
- id: shake
  label: Engine vibration · motion blur
  scenario:
    cameras:
    - extrinsics: {pitch_deg: -14}
      rgb:
        sensor:
          exposure: {max_time: 0.03, target: 0.19}
          motion_blur: {max_samples: 48}
      path: /cam0
    - path: /events
      intrinsics:
        model: pinhole
        width: 1280
        height: 720
        intrinsics: [914.0, 914.0, 639.5, 359.5]
      extrinsics: {pitch_deg: -14}
      rgb: null
      events: {supersample: 1}
    render:
      lighting: {time_utc: '16:08:00'}
    trajectory:
      synth:
        altitude: 700
        heading_deg: 20
        kind: line
        lat: 39.25
        lon: 33.95
        vibration: {broadband_deg: 0.3, harmonic_deg: 0.35, harmonic_hz: 24}
  seconds: 5.5
  text: Vibration and exposure time produce physically based motion blur
  extend: 6.1
- {id: events_shake, label: Event camera · vibration, text: The same vibrating flight seen by an event camera, seconds: 5.5, layout: events, source: shake,
  offset: 6.1}
- id: mountains
  label: Snow-capped mountains
  scenario:

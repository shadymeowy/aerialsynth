      synth: {altitude: 1100, heading_deg: 80, kind: line, lat: 39.17, lon: 33.7, speed: 70}
  seconds: 6
  text: Ridged mountains, erosion gullies and a climate-driven snow line
- id: modalities_rivers
  label: Ground truth · rivers
  layout: modalities
  scenario:

# title: atoll rim from 2 km
# category: coast
# landcover: atoll: reef ring R ~14 km, motus, lagoon
# look: the reef ring of a large atoll curving away around its lagoon, sandy motus, high sun
# target: 13.11900 33.02400
# local solar time 11:30 on 2026-04-15
# status: round 17 moved it from 7.239 87.735 (that atoll is open ocean now: atolls in chains), same framing
world:
  seed: 1
  generator: next
tiles:
  file: out/world.h5
  max_zoom: 18
  margin: 0
  plan_every: 5
trajectory:
  synth:
    rate_hz: 400
    speed_mps: 50.0
    altitude_m: 2000.0
    heading_deg: 180.0
    kind: line
    lat: 13.15105
    lon: 33.02400
    duration_s: 3.0
render:
  supersample: 2
  shading: relit
  lighting:
    mode: clock
    date: '2026-04-15'
    time_utc: '09:18:00'
    time_scale: 1.0
    sky_intensity: 0.55
  atmosphere:
    visibility_km: 80.0
    inscatter: 1.0
cameras:
- path: /cam0
  intrinsics:
    model: pinhole
    width: 1280
    height: 720
    intrinsics:
    - 914.0
    - 914.0
    - 639.5
    - 359.5
  extrinsics:
    mount: forward
    pitch_deg: -30.0
  frame_rate: 1.0
  rgb:
    sensor:
      exposure:
        mode: auto
        tau_s: 0.4
        target: 0.13
      motion_blur:
        enabled: true
        max_samples: 24
      optics:
        defocus_px: 0.25
        chromatic_aberration_px: 0.3
        vignette: 0.25
        bloom: 0.06
      noise:
        enabled: true
        read: 0.08
        shot: 0.1
      tone:
        curve: filmic
        saturation: 0.92
    supersample: 2
output:
  start: 2.0
  end: 2.0
  max_frames: 1
  compression:
    level: 1

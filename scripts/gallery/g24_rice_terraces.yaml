# title: rice paddy terraces
# category: agriculture
# landcover: monsoon-paddy hill country at 1.3-1.9 km
# look: contour terraces of bunded paddies on the hills, flooded and green plots, morning sun from the right
# target: 12.49000 -117.42000
# status: rendered OK (h13): contour paddy terraces, a village
# local solar time 08:00 on 2026-09-15
world:
  seed: 1
  generator: next
tiles:
  file: out/world.h5
  max_zoom: 18
  margin: 0
  plan_every: 5
trajectory:
  synth:
    rate_hz: 400
    speed_mps: 50.0
    altitude_m: 500.0
    heading_deg: 0.0
    kind: line
    lat: 12.48268
    lon: -117.42000

cameras:
- path: /cam0
  intrinsics:
    model: pinhole
    width: 1280
    height: 720
    intrinsics:
    - 914.0
    - 914.0
    - 639.5
    - 359.5
  extrinsics:
    mount: forward
    pitch_deg: -35.0
  frame_rate: 1.0

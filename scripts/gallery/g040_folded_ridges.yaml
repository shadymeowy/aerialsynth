# title: folded ridges from 8 km
# category: mountains
# landcover: semi-arid grass and shrub on an old fold belt, fields in the valleys
# look: wide view: parallel ridges and valleys of an old fold belt under a low morning sun
# target: 27.89900 42.87000
# local solar time 08:00 on 2026-03-20
world:
  seed: 1
  generator: next
tiles:
  file: out/world.h5
  max_zoom: 18
  margin: 0
  plan_every: 5
trajectory:
  synth:
    rate_hz: 400
    speed_mps: 50.0
    altitude_m: 8000.0
    heading_deg: 30.0
    kind: line
    lat: 27.79028
    lon: 42.79906
    duration_s: 3.0
render:
  supersample: 2
  shading: relit
  lighting:
    mode: clock
    date: '2026-03-20'
    time_utc: '05:09:00'
    time_scale: 1.0
    sky_intensity: 0.55
  atmosphere:
    visibility_km: 80.0
    inscatter: 1.0
cameras:
- path: /cam0
  intrinsics:
    model: pinhole
    width: 1280
    height: 720
    intrinsics:
    - 914.0
    - 914.0
    - 639.5
    - 359.5
  extrinsics:
    mount: forward
    pitch_deg: -30.0
  frame_rate: 1.0
  rgb:
    sensor:
      exposure:
        mode: auto
        tau_s: 0.4
        target: 0.13
      motion_blur:
        enabled: true
        max_samples: 24
      optics:
        defocus_px: 0.25
        chromatic_aberration_px: 0.3
        vignette: 0.25
        bloom: 0.06
      noise:
        enabled: true
        read: 0.08
        shot: 0.1
      tone:
        curve: filmic
        saturation: 0.92
    supersample: 2
output:
  start: 2.0
  end: 2.0
  max_frames: 1
  compression:
    level: 1

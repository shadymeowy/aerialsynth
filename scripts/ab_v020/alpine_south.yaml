        max_samples: 24
      optics:
        defocus_px: 0.25
        chromatic_aberration_px: 0.3
        vignette: 0.25
        bloom: 0.06
      noise:
        enabled: true
        read: 0.08
        shot: 0.1
      tone:
        curve: filmic
        saturation: 0.92

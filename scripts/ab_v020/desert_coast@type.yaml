# desert_coast at a place of the same type in the next generator's world: a hyper-arid coast (hot desert erg, 86 mm a
# year) where a wadi with palms reaches a sabkha and tidal-flat shore, the camera over the desert 4 km from the sea,
# looking at the coast (18.445 N 114.125 E, heading 40; rounds 4-8 showed a river delta inland, no sea in view)
# (the same local solar time)
world:
  seed: 1
  generator: next
tiles:
  file: out/world.h5
  max_zoom: 18
  margin: 0
  plan_every: 5
trajectory:
  synth:
    rate_hz: 400
    speed_mps: 50
    kind: line
    lat: 18.445
    lon: 114.125
    heading_deg: 40
    altitude_m: 900
    duration_s: 8.6
render:
  supersample: 2
  shading: relit
  lighting:
    mode: clock
    date: '2026-06-21'
    time_utc: '01:54:00'
    time_scale: 1.0
    sky_intensity: 0.55
  atmosphere:
    visibility_km: 40
    inscatter: 1.0
cameras:
- path: /cam0
  intrinsics:
    model: pinhole
    width: 640
    height: 360
    intrinsics:
    - 457.0
    - 457.0
    - 319.5
    - 179.5
  extrinsics:
    mount: forward
    pitch_deg: -30
  frame_rate: 0.4545454545454546
  rgb:
    sensor:
      exposure:
        mode: auto
        tau_s: 0.4
        target: 0.13
      motion_blur:
        enabled: true
        max_samples: 24
      optics:
        defocus_px: 0.25
        chromatic_aberration_px: 0.3
        vignette: 0.25
        bloom: 0.06
      noise:
        enabled: true
        read: 0.08
        shot: 0.1
      tone:
        curve: filmic
        saturation: 0.92
    supersample: 2
output:
  start: 1.0
  compression:
    level: 1
  end: 7.6

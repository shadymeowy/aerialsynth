# tropics at a place of the same type in the next generator's world: a town of 10 000 in the plantation lowland
# (3.63 N, 18 km from v0.2.0's place; the camera ~2.3 km before it, as v0.2.0's town; round 5 used paddy hills)
# (the same local solar time and date)
world:
  seed: 1
  generator: next
tiles:
  file: out/world.h5
  max_zoom: 18
  margin: 0
  plan_every: 5
trajectory:
  synth:
    rate_hz: 400
    speed_mps: 60
    kind: line
    lat: 3.6504
    lon: -103.2551
    heading_deg: 215
    altitude_m: 1000
    duration_s: 9.1
render:
  supersample: 2
  shading: relit
  lighting:
    mode: clock
    date: '2026-06-21'
    time_utc: '16:19:17'
    time_scale: 1.0
    sky_intensity: 0.55
  atmosphere:
    visibility_km: 40
    inscatter: 1.0
cameras:
- path: /cam0
  intrinsics:
    model: pinhole
    width: 640
    height: 360
    intrinsics:
    - 457.0
    - 457.0
    - 319.5
    - 179.5
  extrinsics:
    mount: forward
    pitch_deg: -32
  frame_rate: 0.4225352112676057
  rgb:
    sensor:
      exposure:
        mode: auto
        tau_s: 0.4
        target: 0.13
      motion_blur:
        enabled: true
        max_samples: 24
      optics:
        defocus_px: 0.25
        chromatic_aberration_px: 0.3
        vignette: 0.25
        bloom: 0.06
      noise:
        enabled: true
        read: 0.08
        shot: 0.1
      tone:
        curve: filmic
        saturation: 0.92
    supersample: 2
output:
  start: 1.0
  compression:
    level: 1
  end: 8.1

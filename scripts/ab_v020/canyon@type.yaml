# canyon at a place of the same type in the next generator's world: canyon (docs/next/kits/mountains_places.csv), the camera
# over the floor of the 850 m deep canyon 10 km SSE of the listed place, looking along it (heading 80 instead of 120:
# along the canyon; round 4 looked at the shallow side canyons on the plateau) (the same local solar time)
world:
  seed: 1
  generator: next
tiles:
  file: out/world.h5
  max_zoom: 18
  margin: 0
  plan_every: 5
trajectory:
  synth:
    rate_hz: 400
    speed_mps: 50
    altitude_m: 900
    heading_deg: 80
    kind: line
    lat: 21.172
    lon: -121.31
    duration_s: 7.6
render:
  supersample: 2
  shading: relit
  lighting:
    mode: clock
    date: '2026-06-21'
    time_utc: '00:35:14'
    time_scale: 1.0
    sky_intensity: 0.55
  atmosphere:
    visibility_km: 40
    inscatter: 1.0
cameras:
- path: /cam0
  intrinsics:
    model: pinhole
    width: 640
    height: 360
    intrinsics:
    - 457.0
    - 457.0
    - 319.5
    - 179.5
  extrinsics:
    mount: forward
    pitch_deg: -30
  frame_rate: 0.5357142857142857
  rgb:
    sensor:
      exposure:
        mode: auto
        tau_s: 0.4
        target: 0.13
      motion_blur:
        enabled: true
        max_samples: 24
      optics:
        defocus_px: 0.25
        chromatic_aberration_px: 0.3
        vignette: 0.25
        bloom: 0.06
      noise:
        enabled: true
        read: 0.08
        shot: 0.1
      tone:
        curve: filmic
        saturation: 0.92
    supersample: 2
output:
  start: 1.0
  compression:
    level: 1
  end: 6.6

# Night flight over towns: low-light camera, horizon in view (sky, stars, town glow).
# Moonless: new moon on 2026-03-19; see night_moon.yaml for a full-moon night.
world: { seed: 1 }
tiles: { file: out/night/world.h5, max_zoom: 17, lazy: true }
trajectory:
  file: out/night/traj.csv
  synth: { kind: line, altitude: 1200, speed: 50, duration: 2, heading_deg: 20, lat: 40.03, lon: 32.90 }
camera: { model: pinhole, width: 640, height: 480, intrinsics: [400, 400, 319.5, 239.5], distortion: [0, 0, 0, 0] }
extrinsics: { mount: forward, pitch_deg: -22 }
render:
  lighting: { mode: clock, date: "2026-03-19", time_utc: "21:30:00" }
sensor:
  exposure: { max_time: 0.033, max_gain: 64 }
output: { dir: out/night/seq, h5: null, frame_rate: 2, max_frames: 1 }

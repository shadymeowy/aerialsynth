# Cruise altitude: 10 km above the ellipsoid, wide FOV tilted 25° forward.
world: { seed: 1 }
tiles: { file: out/cruise/world.h5, max_zoom: 16, lazy: true }
trajectory:
  file: out/cruise/traj.csv
  synth: { kind: line, altitude_m: 10000, altitude_ref: ellipsoid, speed_mps: 230, duration_s: 4 }
cameras:
  - path: /cam0
    intrinsics: { model: pinhole, width: 640, height: 480, intrinsics: [320, 320, 319.5, 239.5] }
    extrinsics: { mount: nadir, pitch_deg: 25 }
    frame_rate: 1
    rgb: {}
output: { file: out/cruise/seq.h5, png_dir: out/cruise/png, max_frames: 2 }

# Forward-looking camera tilted 35° down at ~2500 m AGL, clock-driven sun near sunset.
world: { seed: 1 }
tiles: { file: out/oblique/world.h5, max_zoom: 17, lazy: true }
trajectory:
  file: out/oblique/traj.csv
  synth: { kind: line, altitude_m: 2500, speed_mps: 70, duration_s: 4, heading_deg: 250 }
render:
  lighting: { mode: clock, date: "2026-06-21", time_utc: "16:20:00" }
cameras:
  - path: /cam0
    intrinsics: { model: pinhole, width: 640, height: 480, intrinsics: [400, 400, 319.5, 239.5] }
    extrinsics: { mount: forward, pitch_deg: -35 }
    frame_rate: 2
    rgb: {}
output: { file: out/oblique/seq.h5, png_dir: out/oblique/png, max_frames: 2 }

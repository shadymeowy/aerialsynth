# Example dataset scenario: 60 s of low-level flight (600 m AGL) with a forward-oblique camera,
# wind / turbulence / vibration from the flight recorder, late-afternoon sun, full sensor model,
# IMU.   terrain run -c configs/dataset.yaml
world:
  seed: 7
  tile_supersample: 2
tiles:
  file: out/dataset/world.h5
  max_zoom: 18
  plan_every: 2          # plan with every 2nd frame (views overlap heavily)
trajectory:
  file: out/dataset/traj.csv
  synth:
    kind: random
    altitude_m: 600
    altitude_ref: agl
    speed_mps: 40
    duration_s: 60
    rate_hz: 400            # high-rate record for motion blur / vibration
    radius_m: 1500
    seed: 3
    wind: { speed_mps: 7, direction_deg: 250, turbulence: 1.2, gust_rate_per_min: 1.0, gust_amplitude_mps: 4 }
    vibration: { harmonic_deg: 0.05, harmonic_hz: 42, broadband_deg: 0.04 }
render:
  supersample: 3
  shading: relit
  lighting: { mode: clock, date: "2026-09-15", time_utc: "14:30:00", time_scale: 1.0 }
  atmosphere: { visibility_km: 45 }
cameras:
  - path: /cam0
    intrinsics:            # camodocal schema (pinhole | pinhole_full | kannala_brandt | mei | scaramuzza)
      model: pinhole
      width: 752
      height: 480
      intrinsics: [420.0, 420.0, 375.5, 239.5]
      distortion: [-0.12, 0.02, 0.0003, -0.0002]
    extrinsics:
      mount: forward
      pitch_deg: -40       # look 40° below the nose
      translation: [0.4, 0.0, 0.1]
    frame_rate: 10
    rgb:
      sensor:
        exposure: { mode: auto, tau_s: 0.5, max_time_s: 0.008 }
        motion_blur: { enabled: true, max_samples: 16 }
        optics: { defocus_px: 0.4, chromatic_aberration_px: 0.5, vignette: 0.3 }
        noise: { enabled: true, read: 0.15, shot: 0.2 }
    depth: {}
    flow: {}
    landcover: {}
imu: { path: /imu, rate_hz: 200, extrinsics: { translation: [0.1, 0.0, 0.05] } }
output:
  file: out/dataset/seq.h5

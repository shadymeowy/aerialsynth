# Event camera simulation (ESIM-style) over the quick world: `terrain events -c configs/events.yaml`
# Output: out/events/events.h5 in the M3ED layout read by camodocal (/prophesee/left/{x,y,t,p,ms_map_idx}).
world: { seed: 1 }
tiles: { file: out/quick/world.h5, max_zoom: 17, lazy: true }
trajectory: { file: out/quick/traj.csv }
camera:                    # frame camera (also used by the event camera unless events.camera is set)
  model: pinhole
  width: 640
  height: 480
  intrinsics: [420.0, 420.0, 319.5, 239.5]
  distortion: [-0.05, 0.01, 0.0, 0.0]
output: { dir: out/events/seq, h5: out/events/seq.h5, frame_rate: 10, end: 2.0 }
events:
  enabled: true
  h5: out/events/events.h5
  contrast_pos: 0.25
  contrast_neg: 0.25
  contrast_sigma: 0.03
  refractory_us: 100
  max_px_per_step: 0.5
  supersample: 2

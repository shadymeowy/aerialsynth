# Event camera simulation (ESIM-style) over the quick world: `terrain events -c configs/events.yaml`
# Everything (frames, GT, IMU, events) goes into output.h5; group names come from output.layout
# (defaults are M3ED-like, as camodocal reads them).
world: { seed: 1 }
tiles: { file: out/quick/world.h5, max_zoom: 17, lazy: true }
trajectory: { file: out/quick/traj.csv }
camera:                    # frame camera (also used by the event camera unless events.camera is set)
  model: pinhole
  width: 640
  height: 480
  intrinsics: [420.0, 420.0, 319.5, 239.5]
  distortion: [-0.05, 0.01, 0.0, 0.0]
output: { dir: out/events/seq, png: false, h5: out/events/seq.h5, frame_rate: 10, end: 0.5 }
imu: { enabled: true, rate_hz: 200 }
events:
  enabled: true
  contrast_pos: 0.25
  contrast_neg: 0.25
  contrast_sigma: 0.03
  refractory_us: 100
  max_px_per_step: 0.5
  supersample: 2

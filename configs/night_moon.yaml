# Night flight over towns: low-light camera, horizon in view (sky, stars, town glow).
# Full-moon night (2026-03-03): moonlit terrain, moon disc in the sky.
world: { seed: 1 }
tiles: { file: out/night_moon/world.h5, max_zoom: 17, lazy: true }
trajectory:
  file: out/night_moon/traj.csv
  synth: { kind: line, altitude: 1200, speed: 50, duration: 2, heading_deg: 20, lat: 40.03, lon: 32.90 }
camera: { model: pinhole, width: 640, height: 480, intrinsics: [400, 400, 319.5, 239.5], distortion: [0, 0, 0, 0] }
extrinsics: { mount: forward, pitch_deg: -22 }
render:
  lighting: { mode: clock, date: "2026-03-03", time_utc: "21:00:00" }
sensor:
  exposure: { max_time: 0.05, max_gain: 256 }
output: { dir: out/night_moon/seq, h5: null, frame_rate: 2, max_frames: 1 }

# The seed-1 world in the viewer:   terrain view -c configs/view.yaml          (map; M: camera)
#                                   terrain view -c configs/view.yaml --camera-view
# The camera view renders /cam0 below with this lighting, as a dataset frame would look.
world: { seed: 1 }
tiles: { file: out/explorer/world.h5, max_zoom: 17 }
render:
  supersample: 1
  lighting: { mode: clock, date: "2026-06-21", time_utc: "07:30:00" }   # ~09:40 local solar time
cameras:
  - path: /cam0
    intrinsics: { model: pinhole, width: 1280, height: 720, intrinsics: [747.6, 747.6, 639.5, 359.5] }
    extrinsics: { mount: forward, pitch_deg: -15 }
    rgb: {}

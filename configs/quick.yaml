# Small smoke-test scenario: 10 s of flight, 5 fps, nadir camera at ~1000 m AGL.
world:
  seed: 1
tiles:
  file: out/quick/world.h5
  max_zoom: 17
trajectory:
  file: out/quick/traj.csv
  synth:
    kind: random
    altitude: 1000
    speed: 50
    duration: 10
render:
  supersample: 3
cameras:
  - path: /cam0
    intrinsics:
      model: pinhole
      width: 640
      height: 512
      intrinsics: [457.0, 457.0, 319.5, 255.5]
      distortion: [-0.05, 0.01, 0.0, 0.0]
    frame_rate: 5
    rgb: {}
    depth: {}
    flow: {}
    landcover: {}
imu: {}
output:
  file: out/quick/seq.h5
  png_dir: out/quick/png

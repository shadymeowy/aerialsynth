[package]
name = "aerialsynth-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "C API of aerialsynth: tiles of a procedural world, generated into its HDF5 tile store on demand"
publish = false

[lib]
name = "aerialsynth"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aerialsynth-core.workspace = true

[dev-dependencies]
# regenerates the header in tests/header.rs (it must match include/aerialsynth.h)
cbindgen = { version = "0.29", default-features = false }

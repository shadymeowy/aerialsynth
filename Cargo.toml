[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
geodesy = { path = "crates/geodesy" }
h5 = { path = "crates/h5" }
tilestore = { path = "crates/tilestore" }
terragen = { path = "crates/terragen" }
render = { path = "crates/render" }
explorer = { path = "crates/explorer" }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.12.4", features = ["static", "zlib"] }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
rayon = "1.10"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = "0.17"
flate2 = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
